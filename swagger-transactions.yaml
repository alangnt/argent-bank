swagger: "2.0"
info:
  title: Argent Bank Transactions API
  description: |
    Proposed API contract for **Phase 2 — Transactions** of Argent Bank.

    This document extends the existing Argent Bank API (which already covers
    user signup, login and profile) with the endpoints required by the
    transactions feature. Per the product brief, an authenticated user must be
    able to:
      * view all of their transactions for the current month, grouped by account;
      * view the details of a single transaction in a dedicated view;
      * add, edit or delete information on a transaction.

    ### Design notes
    * **Resource model.** A `Transaction` always belongs to an `Account`, so
      transactions are exposed as a sub-resource of an account
      (`/accounts/{accountId}/transactions/{transactionId}`), which keeps
      ownership checks simple.
    * **Grouped by account in one call.** `GET /transactions` returns every
      account of the user together with its transactions for the current
      month, so the "grouped by account" view needs a single request.
    * **Transactions are bank records.** Transactions are created by the bank
      and their core fields (date, description, amount, balance, type) are
      immutable. The user can only add, edit or delete the *information* they
      attach to a transaction: its `category` and free-text `notes`. All three
      operations go through a single endpoint,
      `PATCH /accounts/{accountId}/transactions/{transactionId}`, following
      JSON Merge Patch semantics:
      * add / edit → send the field with a value (`{ "notes": "Lunch" }`);
      * delete → send the field with `null` (`{ "notes": null }`).

      There is intentionally no endpoint to create or delete a whole
      transaction.
    * **Envelope & auth.** Responses reuse the existing
      `{ status, message, body }` envelope and the same Bearer (JWT) security
      scheme as the rest of the Argent Bank API.
  version: "1.0.0"
host: localhost:3001
basePath: /api/v1
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: >-
      JWT obtained from `POST /user/login`, sent as `Authorization: Bearer <token>`.
security:
  - Bearer: []

tags:
  - name: Transactions
    description: Operations on the transactions of the authenticated user.

paths:
  /transactions:
    get:
      tags:
        - Transactions
      summary: List all transactions of the current month, grouped by account
      description: >-
        Returns every account of the authenticated user, each with its
        transactions for the current calendar month. Within each account,
        transactions are sorted by date (most recent first). Accounts without
        transactions for the month are included with an empty list.
      operationId: getTransactionsGroupedByAccount
      security:
        - Bearer: []
      responses:
        "200":
          description: Transactions successfully retrieved.
          schema:
            $ref: "#/definitions/GroupedTransactionsResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
          $ref: "#/responses/InternalServerError"

  /accounts/{accountId}/transactions/{transactionId}:
    get:
      tags:
        - Transactions
      summary: Get the details of a single transaction
      description: >-
        Returns the full details of one transaction, including the editable
        `category` and `notes`. Powers the transaction-detail view.
      operationId: getTransactionById
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/AccountId"
        - $ref: "#/parameters/TransactionId"
      responses:
        "200":
          description: Transaction successfully retrieved.
          schema:
            $ref: "#/definitions/TransactionResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalServerError"
    patch:
      tags:
        - Transactions
      summary: Add, edit or delete information on a transaction
      description: >-
        Adds, edits or deletes the user-editable information of a transaction
        (`category` and/or `notes`). Only the fields present in the request
        body are changed: a string value sets the field, `null` removes it
        (the transaction itself is kept). Removing a field that is already
        absent succeeds. Any other field (amount, date, balance, type, …) is
        rejected with `400`.
      operationId: updateTransactionInfo
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/AccountId"
        - $ref: "#/parameters/TransactionId"
        - name: body
          in: body
          required: true
          description: Fields to add, update (string) or delete (`null`).
          schema:
            $ref: "#/definitions/UpdateTransactionPayload"
      responses:
        "200":
          description: Transaction successfully updated.
          schema:
            $ref: "#/definitions/TransactionResponse"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalServerError"

parameters:
  AccountId:
    name: accountId
    in: path
    required: true
    type: string
    description: Unique identifier of the account.
  TransactionId:
    name: transactionId
    in: path
    required: true
    type: string
    description: Unique identifier of the transaction.

responses:
  BadRequest:
    description: >-
      Validation error: empty body, invalid value, or attempt to modify a
      non-editable field.
    schema:
      $ref: "#/definitions/ApiError"
    examples:
      application/json:
        status: 400
        message: "Field 'amount' is not editable"
  Unauthorized:
    description: Missing or invalid JWT.
    schema:
      $ref: "#/definitions/ApiError"
    examples:
      application/json:
        status: 401
        message: Invalid or missing token
  Forbidden:
    description: The transaction/account does not belong to the authenticated user.
    schema:
      $ref: "#/definitions/ApiError"
    examples:
      application/json:
        status: 403
        message: Access to this resource is forbidden
  NotFound:
    description: No transaction matches the supplied identifiers.
    schema:
      $ref: "#/definitions/ApiError"
    examples:
      application/json:
        status: 404
        message: Transaction not found
  InternalServerError:
    description: Internal server error.
    schema:
      $ref: "#/definitions/ApiError"
    examples:
      application/json:
        status: 500
        message: Internal server error

definitions:
  # ---- Core resources -------------------------------------------------------
  Account:
    type: object
    properties:
      id:
        type: string
        example: "5f0f2c9d4b9e8a0012a3b456"
      title:
        type: string
        description: Human-readable account name.
        example: Argent Bank Checking
      accountNumber:
        type: string
        description: Masked account number as shown in the UI.
        example: "x8349"
      type:
        type: string
        enum: [checking, savings, credit-card]
        example: checking
      balance:
        type: number
        format: double
        description: Current available balance.
        example: 2082.79
      currency:
        type: string
        description: ISO 4217 currency code.
        example: USD
      updatedAt:
        type: string
        format: date-time

  Transaction:
    type: object
    properties:
      id:
        type: string
        example: "5f0f3a1e4b9e8a0012a3b789"
      accountId:
        type: string
        example: "5f0f2c9d4b9e8a0012a3b456"
      date:
        type: string
        format: date-time
        example: "2020-06-20T14:31:00.000Z"
      description:
        type: string
        example: Golden Sun Bakery
      amount:
        type: number
        format: double
        description: Signed amount; negative for a debit, positive for a credit.
        example: -8.00
      currency:
        type: string
        example: USD
      balance:
        type: number
        format: double
        description: Account balance immediately after this transaction.
        example: 2082.79
      transactionType:
        type: string
        enum: [electronic, transfer, cash, check, card]
        example: electronic
      category:
        type: string
        description: User-editable category. Absent when not set.
        example: Food
      notes:
        type: string
        description: User-editable free-text note. Absent when not set.
        example: Lunch with the team

  AccountTransactions:
    type: object
    description: One account and its transactions for the current month.
    properties:
      account:
        $ref: "#/definitions/Account"
      transactions:
        type: array
        items:
          $ref: "#/definitions/Transaction"

  # ---- Request payloads -----------------------------------------------------
  UpdateTransactionPayload:
    type: object
    minProperties: 1
    additionalProperties: false
    description: >-
      At least one editable field must be provided. Only `category` and `notes`
      are user-editable; any other property is rejected. Set a field to a
      string to add or edit it, or to `null` to delete it.
    properties:
      category:
        type: string
        x-nullable: true
        minLength: 1
        description: New category, or `null` to remove it.
        example: Food
      notes:
        type: string
        x-nullable: true
        minLength: 1
        maxLength: 500
        description: New note, or `null` to remove it.
        example: Lunch with the team

  # ---- Response envelopes ---------------------------------------------------
  GroupedTransactionsResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
        example: Transactions retrieved successfully
      body:
        type: object
        properties:
          month:
            type: string
            description: The month the results belong to (`YYYY-MM`).
            example: "2020-06"
          accounts:
            type: array
            items:
              $ref: "#/definitions/AccountTransactions"

  TransactionResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
        example: Transaction retrieved successfully
      body:
        $ref: "#/definitions/Transaction"

  ApiError:
    type: object
    properties:
      status:
        type: integer
        description: HTTP status code of the error.
      message:
        type: string
        description: Human-readable error message.
