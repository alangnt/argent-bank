swagger: '2.0'
info:
  title: Argent Bank Transactions API
  description: |
    Proposed API contract for **Phase 2 — Transactions** of Argent Bank.

    This document extends the existing Argent Bank API (which already covers
    user signup, login and profile) with the endpoints required by the
    transactions feature. Per the product brief, an authenticated user must be
    able to:
      * view all of their transactions for the current month, grouped by account;
      * view the details of a single transaction in a dedicated view;
      * add, edit or delete information on a transaction.

    ### Design notes
    * **Resource model.** A `Transaction` always belongs to an `Account`, so
      transactions are exposed as a sub-resource of an account
      (`/accounts/{accountId}/transactions`), which keeps ownership checks
      simple.
    * **Grouped by account in one call.** `GET /transactions` returns every
      account of the user together with its transactions for the month, so the
      "grouped by account" view needs a single request. The per-account list
      remains available for the transactions page of a single account.
    * **Current month by default.** Both list endpoints accept an optional
      `month` filter; when omitted they return the current calendar month,
      which is the default view in the mock-ups.
    * **Transactions are bank records.** Transactions are created by the bank
      and their core fields (date, description, amount, balance, type) are
      immutable. The user can only add, edit or delete the *information* they
      attach to a transaction: its `category` and free-text `notes`.
      * add / edit → `PATCH /accounts/{accountId}/transactions/{transactionId}`
      * delete → `DELETE /accounts/{accountId}/transactions/{transactionId}/{field}`

      There is intentionally no endpoint to create or delete a whole
      transaction.
    * **Envelope & auth.** Responses reuse the existing
      `{ status, message, body }` envelope and the same Bearer (JWT) security
      scheme as the rest of the Argent Bank API.
  version: '1.0.0'
  contact:
    name: Argent Bank
  license:
    name: Proprietary
host: localhost:3001
basePath: /api/v1
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: >-
      JWT obtained from `POST /user/login`, sent as `Authorization: Bearer <token>`.
security:
  - Bearer: []

tags:
  - name: Accounts
    description: The bank accounts owned by the authenticated user.
  - name: Transactions
    description: Operations on the transactions of the authenticated user.

paths:
  /accounts:
    get:
      tags:
        - Accounts
      summary: List the authenticated user's accounts
      description: >-
        Returns every account (checking, savings, credit card, …) that belongs
        to the authenticated user, together with its current balance. Used to
        render the account cards on the profile page.
      operationId: getAccounts
      security:
        - Bearer: []
      responses:
        '200':
          description: Accounts successfully retrieved.
          schema:
            $ref: '#/definitions/AccountsResponse'
        '401':
          description: Missing or invalid JWT.
          schema:
            $ref: '#/definitions/ApiError'
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ApiError'

  /accounts/{accountId}:
    get:
      tags:
        - Accounts
      summary: Get a single account
      description: Returns the details and current balance of one account owned by the user.
      operationId: getAccountById
      security:
        - Bearer: []
      parameters:
        - $ref: '#/parameters/AccountId'
      responses:
        '200':
          description: Account successfully retrieved.
          schema:
            $ref: '#/definitions/AccountResponse'
        '401':
          description: Missing or invalid JWT.
          schema:
            $ref: '#/definitions/ApiError'
        '403':
          description: The account does not belong to the authenticated user.
          schema:
            $ref: '#/definitions/ApiError'
        '404':
          description: No account matches the supplied accountId.
          schema:
            $ref: '#/definitions/ApiError'
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ApiError'

  /transactions:
    get:
      tags:
        - Transactions
      summary: List all transactions for a month, grouped by account
      description: >-
        Returns every account of the authenticated user, each with its
        transactions for a single calendar month. When the `month` parameter is
        omitted, the **current month** is returned. Within each account,
        transactions are sorted by date (most recent first). Accounts without
        transactions for the month are included with an empty list.
      operationId: getTransactionsGroupedByAccount
      security:
        - Bearer: []
      parameters:
        - $ref: '#/parameters/Month'
        - $ref: '#/parameters/Category'
      responses:
        '200':
          description: Transactions successfully retrieved.
          schema:
            $ref: '#/definitions/GroupedTransactionsResponse'
        '400':
          description: Invalid query parameter (e.g. malformed `month`).
          schema:
            $ref: '#/definitions/ApiError'
        '401':
          description: Missing or invalid JWT.
          schema:
            $ref: '#/definitions/ApiError'
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ApiError'

  /accounts/{accountId}/transactions:
    get:
      tags:
        - Transactions
      summary: List transactions of an account for a given month
      description: >-
        Returns the transactions of the given account for a single calendar
        month. When the `month` parameter is omitted, the **current month** is
        returned. Results are paginated and sorted by date (most recent first).
      operationId: getAccountTransactions
      security:
        - Bearer: []
      parameters:
        - $ref: '#/parameters/AccountId'
        - $ref: '#/parameters/Month'
        - $ref: '#/parameters/Category'
        - name: page
          in: query
          required: false
          type: integer
          minimum: 1
          default: 1
          description: 1-based page number for pagination.
        - name: limit
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 100
          default: 25
          description: Number of transactions per page.
      responses:
        '200':
          description: Transactions successfully retrieved.
          schema:
            $ref: '#/definitions/TransactionsResponse'
        '400':
          description: Invalid query parameter (e.g. malformed `month`).
          schema:
            $ref: '#/definitions/ApiError'
        '401':
          description: Missing or invalid JWT.
          schema:
            $ref: '#/definitions/ApiError'
        '403':
          description: The account does not belong to the authenticated user.
          schema:
            $ref: '#/definitions/ApiError'
        '404':
          description: No account matches the supplied accountId.
          schema:
            $ref: '#/definitions/ApiError'
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ApiError'

  /accounts/{accountId}/transactions/{transactionId}:
    get:
      tags:
        - Transactions
      summary: Get the details of a single transaction
      description: >-
        Returns the full details of one transaction, including the editable
        `category` and `notes`. Powers the transaction-detail view.
      operationId: getTransactionById
      security:
        - Bearer: []
      parameters:
        - $ref: '#/parameters/AccountId'
        - $ref: '#/parameters/TransactionId'
      responses:
        '200':
          description: Transaction successfully retrieved.
          schema:
            $ref: '#/definitions/TransactionResponse'
        '401':
          description: Missing or invalid JWT.
          schema:
            $ref: '#/definitions/ApiError'
        '403':
          description: The transaction/account does not belong to the authenticated user.
          schema:
            $ref: '#/definitions/ApiError'
        '404':
          description: No transaction matches the supplied identifiers.
          schema:
            $ref: '#/definitions/ApiError'
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ApiError'
    patch:
      tags:
        - Transactions
      summary: Add or edit information on a transaction
      description: >-
        Adds or edits the user-editable information of a transaction
        (`category` and/or `notes`). Only the fields present in the request
        body are changed. Any other field (amount, date, balance, type, …) is
        rejected with `400`.
      operationId: updateTransactionInfo
      security:
        - Bearer: []
      parameters:
        - $ref: '#/parameters/AccountId'
        - $ref: '#/parameters/TransactionId'
        - name: body
          in: body
          required: true
          description: Fields to add or update.
          schema:
            $ref: '#/definitions/UpdateTransactionPayload'
      responses:
        '200':
          description: Transaction successfully updated.
          schema:
            $ref: '#/definitions/TransactionResponse'
        '400':
          description: >-
            Validation error: empty body, invalid value, or attempt to modify a
            non-editable field.
          schema:
            $ref: '#/definitions/ApiError'
        '401':
          description: Missing or invalid JWT.
          schema:
            $ref: '#/definitions/ApiError'
        '403':
          description: The transaction/account does not belong to the authenticated user.
          schema:
            $ref: '#/definitions/ApiError'
        '404':
          description: No transaction matches the supplied identifiers.
          schema:
            $ref: '#/definitions/ApiError'
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ApiError'

  /accounts/{accountId}/transactions/{transactionId}/{field}:
    delete:
      tags:
        - Transactions
      summary: Delete a piece of information from a transaction
      description: >-
        Clears the user-editable `category` or `notes` of a transaction. The
        transaction itself is kept. Returns the updated transaction.
      operationId: deleteTransactionInfo
      security:
        - Bearer: []
      parameters:
        - $ref: '#/parameters/AccountId'
        - $ref: '#/parameters/TransactionId'
        - name: field
          in: path
          required: true
          type: string
          enum: [category, notes]
          description: The user-editable field to clear.
      responses:
        '200':
          description: Information successfully deleted.
          schema:
            $ref: '#/definitions/TransactionResponse'
        '400':
          description: '`field` is not one of the user-editable fields.'
          schema:
            $ref: '#/definitions/ApiError'
        '401':
          description: Missing or invalid JWT.
          schema:
            $ref: '#/definitions/ApiError'
        '403':
          description: The transaction/account does not belong to the authenticated user.
          schema:
            $ref: '#/definitions/ApiError'
        '404':
          description: No transaction matches the supplied identifiers.
          schema:
            $ref: '#/definitions/ApiError'
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ApiError'

parameters:
  AccountId:
    name: accountId
    in: path
    required: true
    type: string
    description: Unique identifier of the account.
  TransactionId:
    name: transactionId
    in: path
    required: true
    type: string
    description: Unique identifier of the transaction.
  Month:
    name: month
    in: query
    required: false
    type: string
    pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    description: >-
      Calendar month to return, formatted as `YYYY-MM`
      (e.g. `2020-06`). Defaults to the current month.
  Category:
    name: category
    in: query
    required: false
    type: string
    description: Optional filter restricting results to a single category.

definitions:
  # ---- Core resources -------------------------------------------------------
  Account:
    type: object
    properties:
      id:
        type: string
        example: '5f0f2c9d4b9e8a0012a3b456'
      title:
        type: string
        description: Human-readable account name.
        example: Argent Bank Checking
      accountNumber:
        type: string
        description: Masked account number as shown in the UI.
        example: 'x8349'
      type:
        type: string
        enum: [checking, savings, credit-card]
        example: checking
      balance:
        type: number
        format: double
        description: Current available balance.
        example: 2082.79
      currency:
        type: string
        description: ISO 4217 currency code.
        example: USD
      updatedAt:
        type: string
        format: date-time

  Transaction:
    type: object
    properties:
      id:
        type: string
        example: '5f0f3a1e4b9e8a0012a3b789'
      accountId:
        type: string
        example: '5f0f2c9d4b9e8a0012a3b456'
      date:
        type: string
        format: date-time
        example: '2020-06-20T14:31:00.000Z'
      description:
        type: string
        example: Golden Sun Bakery
      amount:
        type: number
        format: double
        description: Signed amount; negative for a debit, positive for a credit.
        example: -8.00
      currency:
        type: string
        example: USD
      balance:
        type: number
        format: double
        description: Account balance immediately after this transaction.
        example: 2082.79
      transactionType:
        type: string
        enum: [electronic, transfer, cash, check, card]
        example: electronic
      category:
        type: string
        description: User-editable category. Absent when not set.
        example: Food
      notes:
        type: string
        description: User-editable free-text note. Absent when not set.
        example: Lunch with the team

  AccountTransactions:
    type: object
    description: One account and its transactions for the requested month.
    properties:
      account:
        $ref: '#/definitions/Account'
      transactions:
        type: array
        items:
          $ref: '#/definitions/Transaction'

  # ---- Request payloads -----------------------------------------------------
  UpdateTransactionPayload:
    type: object
    minProperties: 1
    additionalProperties: false
    description: >-
      At least one editable field must be provided. Only `category` and `notes`
      are user-editable; any other property is rejected.
    properties:
      category:
        type: string
        minLength: 1
        example: Food
      notes:
        type: string
        minLength: 1
        maxLength: 500
        example: Lunch with the team

  # ---- Response envelopes ---------------------------------------------------
  AccountsResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
        example: Accounts retrieved successfully
      body:
        type: array
        items:
          $ref: '#/definitions/Account'

  AccountResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
        example: Account retrieved successfully
      body:
        $ref: '#/definitions/Account'

  GroupedTransactionsResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
        example: Transactions retrieved successfully
      body:
        type: object
        properties:
          month:
            type: string
            description: The month the results belong to (`YYYY-MM`).
            example: '2020-06'
          accounts:
            type: array
            items:
              $ref: '#/definitions/AccountTransactions'

  TransactionsResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
        example: Transactions retrieved successfully
      body:
        type: object
        properties:
          month:
            type: string
            description: The month the results belong to (`YYYY-MM`).
            example: '2020-06'
          page:
            type: integer
            example: 1
          limit:
            type: integer
            example: 25
          total:
            type: integer
            description: Total number of transactions matching the query.
            example: 42
          transactions:
            type: array
            items:
              $ref: '#/definitions/Transaction'

  TransactionResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
        example: Transaction retrieved successfully
      body:
        $ref: '#/definitions/Transaction'

  ApiError:
    type: object
    properties:
      status:
        type: integer
        example: 404
      message:
        type: string
        example: Transaction not found
